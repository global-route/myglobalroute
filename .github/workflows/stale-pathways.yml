name: Stale Pathway Audit

on:
  schedule:
    - cron: '0 9 * * 1'   # every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run stale pathway audit
        id: audit
        run: |
          OUTPUT=$(node scripts/check-stale-pathways.js 2>&1 || true)
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          node scripts/check-stale-pathways.js > /dev/null 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Open issue if stale entries found
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.audit.outputs.output }}`;
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Stale pathway requirements detected — ${today}`,
              body: [
                '## Stale pathway requirements',
                '',
                'The weekly audit found pathway requirements with `effectiveDate` older than 90 days.',
                'Re-verify each entry against its official source URL, update `effectiveDate` in `src/data/pathways.json`, then run `npm test`.',
                '',
                '```',
                output,
                '```',
                '',
                'Run locally: `node scripts/check-stale-pathways.js`',
              ].join('\n'),
              labels: ['data-freshness'],
            });
