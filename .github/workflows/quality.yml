name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No npm cache until the repository has a committed lockfile.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Validate migration data
        run: npm run data:validate
      - name: Unit tests
        run: npm test -- --coverage --runInBand
      - name: Build site
        run: npm run build
      - name: Verify generated artifacts
        run: npm run build:verify
      - name: Verify SEO and accessibility smoke requirements
        run: npm run seo:a11y:verify
