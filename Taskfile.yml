version: "3"

vars:
  SRC_CSS: src/css
  SRC_JS: src/js
  SRC_PAGES: src/pages
  DIST: dist
  SCRIPTS: scripts
  BASE_URL: https://mypathway2global.org.uk

tasks:

  # ── DEV & BUILD ────────────────────────────────────────────────

  dev:
    desc: "Start Eleventy dev server with live reload"
    cmds:
      - npx @11ty/eleventy --serve

  build:
    desc: "Production Eleventy build"
    cmds:
      - npx @11ty/eleventy
    env:
      NODE_ENV: production

  build:verify:
    desc: "Verify build output integrity"
    cmds:
      - node {{.SCRIPTS}}/verify-build.js

  deploy:
    desc: "Build then deploy via Wrangler (Cloudflare Workers)"
    cmds:
      - task: build
      - npx wrangler deploy

  deploy:verify:
    desc: "Verify the deployed live site"
    cmds:
      - node {{.SCRIPTS}}/verify-deployed-site.js

  # ── TESTS & LINT ───────────────────────────────────────────────

  test:
    desc: "Run all Jest unit tests"
    cmds:
      - npx jest

  test:watch:
    desc: "Jest in watch mode"
    cmds:
      - npx jest --watch

  lint:
    desc: "ESLint all JS in src/js"
    cmds:
      - npx eslint {{.SRC_JS}}

  lint:fix:
    desc: "ESLint with auto-fix"
    cmds:
      - npx eslint {{.SRC_JS}} --fix

  # ── DATA & EVIDENCE ────────────────────────────────────────────

  data:validate:
    desc: "Validate countries + pathways JSON schemas"
    cmds:
      - node {{.SCRIPTS}}/validate-data.js

  data:manifest:
    desc: "Check country source-review manifest (read-only)"
    cmds:
      - node {{.SCRIPTS}}/generate-country-source-manifest.js --check

  data:manifest:write:
    desc: "Regenerate and write country source-review manifest"
    cmds:
      - node {{.SCRIPTS}}/generate-country-source-manifest.js --write

  evidence:freshness:
    desc: "Report evidence freshness across all pathways"
    cmds:
      - node {{.SCRIPTS}}/report-evidence-freshness.js

  evidence:candidates:
    desc: "Report pathways that are candidates for promotion"
    cmds:
      - node {{.SCRIPTS}}/report-promotion-candidates.js

  requirements:readiness:
    desc: "Report requirement field readiness across pathways"
    cmds:
      - node {{.SCRIPTS}}/report-requirement-readiness.js

  commercial:validate:
    desc: "Validate commercial/affiliate registry"
    cmds:
      - node {{.SCRIPTS}}/validate-commercial-registry.js

  # ── SEO & ANALYTICS ────────────────────────────────────────────

  seo:verify:
    desc: "Run SEO + a11y verification on built pages"
    cmds:
      - node {{.SCRIPTS}}/verify-seo-a11y.js

  analytics:sabilytics:
    desc: "Verify Sabilytics script is present on all built pages"
    cmds:
      - |
        TOTAL=$(find dist -name "*.html" | wc -l | tr -d ' ')
        WITH=$(grep -rl "sabilytics.com" dist | wc -l | tr -d ' ')
        WITHOUT=$((TOTAL - WITH))
        echo "Total HTML pages: $TOTAL"
        echo "With Sabilytics:  $WITH"
        echo "Without:          $WITHOUT"
        if [ "$WITHOUT" -gt 0 ]; then
          echo ""
          echo "Pages missing Sabilytics:"
          for f in $(find dist -name "*.html"); do
            if ! grep -q "sabilytics.com" "$f"; then echo "  $f"; fi
          done
        fi

  # ── REVENUE ────────────────────────────────────────────────────

  revenue:status:
    desc: "Show current AdSense and ad slot status"
    cmds:
      - |
        echo "=== ads.txt ==="
        cat public/ads.txt
        echo ""
        echo "=== Active ad slots (not hidden) ==="
        grep -rn "data-ad-slot" src/pages/ src/index.html content/ | grep -v "hidden" | head -20
        echo ""
        echo "=== Hidden ad slots ==="
        grep -rn "data-ad-slot" src/pages/ src/index.html content/ | grep "hidden" | wc -l
        echo "slots still hidden"

  # ── PERFORMANCE ────────────────────────────────────────────────

  perf:sizes:
    desc: "Report CSS and JS asset sizes"
    cmds:
      - |
        echo "=== CSS ==="
        find src/css -name "*.css" -exec du -sh {} \;
        echo ""
        echo "=== JS ==="
        find src/js -name "*.js" -exec du -sh {} \;

  lighthouse:
    desc: "Run Lighthouse CI audit (requires lhci)"
    cmds:
      - |
        if ! command -v lhci &> /dev/null; then
          npm install -g @lhci/cli
        fi
        lhci autorun

  deps:audit:
    desc: "npm audit for known vulnerabilities"
    cmds:
      - npm audit

  deps:outdated:
    desc: "List outdated npm packages"
    cmds:
      - npm outdated

  # ── PIPELINES ──────────────────────────────────────────────────

  verify:
    desc: "Full pre-release verification pipeline"
    cmds:
      - task: data:validate
      - task: data:manifest
      - task: requirements:readiness
      - task: evidence:freshness
      - task: commercial:validate
      - task: test
      - task: build
      - task: build:verify
      - task: seo:verify
      - task: lint

  ci:
    desc: "CI pipeline — lint + test + build + verify"
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: build:verify
      - task: seo:verify
