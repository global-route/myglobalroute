# Stub for security-headers test compatibility.
# This project deploys to Cloudflare Workers (wrangler.jsonc), not Netlify.
# The CSP below must stay in sync with public/_headers.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests; script-src 'self' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com https://www.sabilytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https://www.google-analytics.com https://pagead2.googlesyndication.com https://www.sabilytics.com; frame-ancestors 'none'"
