# Netlify Configuration for Global Route

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "18.16.0"

# This is a static multi-page Eleventy site. Do not rewrite every route to
# index.html: doing so hides real generated pages and breaks deep links.

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https://www.google-analytics.com https://pagead2.googlesyndication.com; frame-ancestors 'none'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[context.branch-deploy]
  command = "npm run build"
  environment = { NODE_ENV = "staging" }

[context.deploy-preview]
  command = "npm run build"
  environment = { NODE_ENV = "staging" }

# Keep Lighthouse as a CI/deploy quality gate only when the Netlify plugin is
# installed/configured by the deployment environment.
[[plugins]]
  package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
    audits = ["accessibility", "best-practices", "performance", "pwa", "seo"]
    publishArtifacts = true
